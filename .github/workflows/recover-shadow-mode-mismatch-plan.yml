name: recover-shadow-mode-mismatch-plan
run-name: recover-shadow-mode-mismatch-plan:${{ inputs.repository }}:${{ inputs.plan_id }}
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Exact owner/repository of the production-labelled shadow plan
        required: true
        type: string
      plan_id:
        description: Exact sha256 plan ID
        required: true
        type: string
      publisher_run_id:
        description: Exact successful shadow publisher run ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: recover-shadow-mode-mismatch-plan
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
        with:
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile && corepack pnpm build
      - name: Verify and repair the historical environment binding
        run: >-
          node dist/src/commands/handle-event.js
          --recover-shadow-mode-mismatch-plan
          --repository "$RECOVERY_REPOSITORY"
          --plan-id "$RECOVERY_PLAN_ID"
          --publisher-run-id "$PUBLISHER_RUN_ID"
        env:
          RECOVERY_REPOSITORY: ${{ inputs.repository }}
          RECOVERY_PLAN_ID: ${{ inputs.plan_id }}
          PUBLISHER_RUN_ID: ${{ inputs.publisher_run_id }}
          LENSO_GITHUB_APP_ID: ${{ secrets.LENSO_GITHUB_APP_ID }}
          LENSO_GITHUB_APP_INSTALLATION_ID: ${{ secrets.LENSO_GITHUB_APP_INSTALLATION_ID }}
          LENSO_GITHUB_APP_PRIVATE_KEY: ${{ secrets.LENSO_GITHUB_APP_PRIVATE_KEY }}
          LENSO_GITHUB_APP_ACTOR: ${{ vars.LENSO_GITHUB_APP_ACTOR }}
          LENSO_EVENT_ACTOR: ${{ vars.LENSO_GITHUB_APP_ACTOR }}
          LENSO_COORDINATOR_FACTS_MODULE: file://${{ github.workspace }}/dist/src/coordinator/production-facts.js
          LENSO_COORDINATOR_MODE: ${{ vars.LENSO_COORDINATOR_MODE }}
          LENSO_SHADOW_NPM_REGISTRY_URL: ${{ vars.LENSO_SHADOW_NPM_REGISTRY_URL }}
          LENSO_SHADOW_OCI_REGISTRY_URL: ${{ vars.LENSO_SHADOW_OCI_REGISTRY_URL }}
