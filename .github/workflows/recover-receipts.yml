name: recover-receipts
run-name: lenso-recover-receipts:${{ github.run_id }}
on:
  workflow_dispatch:
    inputs:
      repository:
        description: Optional exact repository for targeted recovery
        required: false
        type: string
      plan_id:
        description: Optional exact plan ID for targeted recovery
        required: false
        type: string
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
concurrency:
  group: recover-receipts
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: pnpm/action-setup@f2b2b233b538f500472c7274c7012f57857d8ce0
        with:
          run_install: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: pnpm
      - run: corepack pnpm install --frozen-lockfile && corepack pnpm build
      - name: Recover active receipts
        run: |
          if [[ -n "$TARGET_REPOSITORY" || -n "$TARGET_PLAN_ID" ]]; then
            [[ -n "$TARGET_REPOSITORY" && -n "$TARGET_PLAN_ID" ]] || {
              echo "repository and plan_id must be supplied together" >&2
              exit 2
            }
            node dist/src/commands/handle-event.js --recover-active \
              --repository "$TARGET_REPOSITORY" --plan-id "$TARGET_PLAN_ID"
          else
            node dist/src/commands/handle-event.js --recover-active
          fi
        env:
          TARGET_REPOSITORY: ${{ inputs.repository }}
          TARGET_PLAN_ID: ${{ inputs.plan_id }}
          LENSO_GITHUB_APP_ID: ${{ secrets.LENSO_GITHUB_APP_ID }}
          LENSO_GITHUB_APP_INSTALLATION_ID: ${{ secrets.LENSO_GITHUB_APP_INSTALLATION_ID }}
          LENSO_GITHUB_APP_PRIVATE_KEY: ${{ secrets.LENSO_GITHUB_APP_PRIVATE_KEY }}
          LENSO_GITHUB_APP_ACTOR: ${{ vars.LENSO_GITHUB_APP_ACTOR }}
          LENSO_EVENT_ACTOR: ${{ vars.LENSO_GITHUB_APP_ACTOR }}
          LENSO_COORDINATOR_FACTS_MODULE: file://${{ github.workspace }}/dist/src/coordinator/production-facts.js
          LENSO_COORDINATOR_MODE: ${{ vars.LENSO_COORDINATOR_MODE }}
          LENSO_SHADOW_NPM_REGISTRY_URL: ${{ vars.LENSO_SHADOW_NPM_REGISTRY_URL }}
          LENSO_SHADOW_CRATES_API_URL: ${{ vars.LENSO_SHADOW_CRATES_API_URL }}
          LENSO_SHADOW_GITHUB_API_URL: ${{ vars.LENSO_SHADOW_GITHUB_API_URL }}
          LENSO_SHADOW_OCI_REGISTRY_URL: ${{ vars.LENSO_SHADOW_OCI_REGISTRY_URL }}
